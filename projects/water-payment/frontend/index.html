<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>صندوق المال · لوحة التحكم</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="topbar" id="topbar"></div>

<div class="container">
  <div class="cards">
    <div class="card balance">
      <div class="label">الرصيد الحالي</div>
      <div class="value" id="balanceVal">—</div>
    </div>

    <div class="card deposits">
      <div class="label">إجمالي الإيداعات</div>
      <div class="value" id="depositsVal">—</div>
    </div>

    <div class="card withdrawals">
      <div class="label">إجمالي المسحوبات</div>
      <div class="value" id="withdrawalsVal">—</div>
    </div>

    <div class="card">
      <div class="label">المعاملات</div>
      <div class="value" id="countVal">—</div>
    </div>
  </div>

  <div class="panel" id="adminActions" style="display:none;">
    <h2>الإجراءات السريعة</h2>

    <div class="form-actions">
      <button class="btn btn-primary" id="openDepositBtn">
        ＋ إضافة مبلغ
      </button>

      <button class="btn btn-danger" id="openWithdrawBtn">
        － سحب مبلغ
      </button>
    </div>
  </div>


  <div class="panel">
    <h2>أحدث المعاملات</h2>

    <div id="latestTableWrap">
      <p class="empty-state">جاري التحميل…</p>
    </div>

    <div style="margin-top:14px;">
      <a href="transactions.html">عرض جميع المعاملات →</a>
    </div>
  </div>

</div>


<!-- نافذة إضافة مبلغ -->
<div class="modal-backdrop" id="depositModal">
  <div class="modal">

    <h3>إضافة مبلغ</h3>

    <form id="depositForm">

      <div class="form-row">
        <label>المبلغ</label>
        <input type="number" step="0.01" min="0.01" id="depAmount" required>
      </div>

      <div class="form-row">
        <label>اسم المتبرع</label>
        <input type="text" id="depDonor" required>
      </div>

      <div class="form-row">
        <label>التاريخ</label>
        <input type="date" id="depDate">
      </div>

      <div class="form-row">
        <label>ملاحظات</label>
        <textarea id="depNotes" rows="2"></textarea>
      </div>

      <div class="form-actions">

        <button type="submit" class="btn btn-primary">
          حفظ الإيداع
        </button>

        <button type="button" class="btn" id="closeDepositBtn">
          إلغاء
        </button>

      </div>

    </form>

  </div>
</div>



<!-- نافذة سحب مبلغ -->
<div class="modal-backdrop" id="withdrawModal">

  <div class="modal">

    <h3>سحب مبلغ</h3>

    <form id="withdrawForm">

      <div class="form-row">
        <label>المبلغ</label>
        <input type="number" step="0.01" min="0.01" id="wdAmount" required>
      </div>

      <div class="form-row">
        <label>السبب</label>
        <input type="text" id="wdReason" required>
      </div>

      <div class="form-row">
        <label>التاريخ</label>
        <input type="date" id="wdDate">
      </div>

      <div class="form-row">
        <label>ملاحظات</label>
        <textarea id="wdNotes" rows="2"></textarea>
      </div>

      <div class="form-actions">

        <button type="submit" class="btn btn-primary">
          حفظ السحب
        </button>

        <button type="button" class="btn" id="closeWithdrawBtn">
          إلغاء
        </button>

      </div>

    </form>

  </div>

</div>


<div id="toast"></div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabaseClient.js"></script>
<script src="js/api.js"></script>
<script src="js/dashboard.js"></script>

</body>
</html>
